[project]
name = "stemsplitter-api"
version = "0.1.0"
description = "Audio stem separation API and Alpine.js demo"
readme = "readme.md"
authors = [
    { name = "Luqman Al-Hakim", email = "luqman.alhakim2903@gmail.com" }
]
requires-python = "==3.11.*"
dependencies = [
    "audio-separator[gpu]>=0.47.1",
    "audioread>=3.1.0",
    "fastapi[standard]>=0.162.0",
    "hashids>=1.3.1",
    "python-dotenv>=1.0.1",
    "spoolctl>=0.4.11",
    "yt-dlp>=2026.10.21",
]

[project.scripts]
stemsplitter = "stemsplitter:main"


