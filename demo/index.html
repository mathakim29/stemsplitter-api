<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Stemsplitter Demo</title>
    

    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <h3>Stemsplitter API Demo</h3>
    <form id="app-form" method="POST">
      <div class="control-panel">
        <input
          type="file"
          id="file-input"
          name="file"
          accept="audio/*"
          required
        />
      </div>
      <div style="display: flex">
        <span style="margin-right: 10px"> Model: </span>
        <select id="model-select" name="model" required>
          <option value="" disabled selected>Select a model...</option>
        </select>
        <button type="submit" id="submit">Submit</button>
      </div>
    </form>

    <div>
      <pre><code id="result-container"></code></pre>
    </div>
    <code id="waveform-container"></code>

    <script src="index.js" type="module"></script>
  </body>
</html>
