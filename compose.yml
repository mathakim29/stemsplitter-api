services:
  caddy:
    image: caddy:2.11-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "${PORT}:80"       # HTTP

    volumes:
      # Mount your configuration file (read-only for security)
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # CRUCIAL: Persistent volumes for Let's Encrypt certificates and configuration state
      - /tmp/caddy_data:/data
      - /tmp/caddy_config:/config
    env_file:
      - .env


  stemsplitter-api:
    build:
      context: .
      dockerfile_inline: |
        FROM beveradb/audio-separator:gpu-0.44.5
        WORKDIR /app
        RUN pip install --no-cache-dir "fastapi[standard]" hypercorn uvloop httpx rq redis
        ENTRYPOINT []
    env_file:
      - .env
    environment:
      PYTHONPYCACHEPREFIX: /tmp/pycache
      REDIS_HOST: redis
    depends_on:
      - redis
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: "no"
    volumes:
      - ./src:/app:z
      - /tmp/asep/exports:/etc/exports:Z
      - /tmp/asep/models:/etc/models:Z
    env_file:
      - .env

    command: sh -c "rq worker audio-processing & hypercorn index:app --bind 0.0.0.0:8000 --reload"

  php-demo:
      image: dunglas/frankenphp:1.12.7-php8-alpine
      container_name: php-demo
      environment:
        SERVER_NAME: ":80"
        SERVER_ROOT: "/app/public"
      volumes:
            - ${PWD}/demo:/app/public/demo:z
            - /tmp/caddy_data:/data:z
            - /tmp/caddy_config:/config:z
      env_file:
        - .env

  redis:
    image: redis:alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    volumes:
      - /tmp/redis_data:/data
    env_file:
      - .env




    